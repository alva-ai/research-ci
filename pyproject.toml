[project]
name = "alpha-ci"
version = "0.1.0"
description = "CI for alpha research: time, holdout, verdict."
readme = "README.md"
authors = [
    { name = "Lqz13Th", email = "lqz13th@outlook.com" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=15",
    "scipy>=1.13",
    "typer>=0.12",
]

[project.scripts]
aci = "alpha_ci.cli.main:app"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.1",
    "hypothesis>=6.168.3",
    "import-linter>=2.15",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.11"
include = ["src", "tests"]

[tool.importlinter]
root_package = "alpha_ci"

[[tool.importlinter.contracts]]
name = "layers"
type = "layers"
layers = [
    "alpha_ci.cli",
    "alpha_ci.llm",
    "alpha_ci.workflow",
    "alpha_ci.stages | alpha_ci.store | alpha_ci.runner | alpha_ci.render",
    "alpha_ci.kernel",
    "alpha_ci.api",
]

[[tool.importlinter.contracts]]
name = "reference plugins only use api"
type = "forbidden"
source_modules = ["alpha_ci.reference_plugins"]
forbidden_modules = [
    "alpha_ci.kernel",
    "alpha_ci.stages",
    "alpha_ci.workflow",
    "alpha_ci.store",
    "alpha_ci.runner",
    "alpha_ci.render",
    "alpha_ci.llm",
    "alpha_ci.cli",
]

